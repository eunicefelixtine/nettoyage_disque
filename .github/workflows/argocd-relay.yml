name: Argocd image relay

on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull argocd from quay.io and push to Docker Hub
        run: |
          docker pull quay.io/argoproj/argocd:v3.5.0
          docker tag quay.io/argoproj/argocd:v3.5.0 "${{ secrets.DOCKERHUB_USERNAME }}/argocd:v3.5.0"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/argocd:v3.5.0"
