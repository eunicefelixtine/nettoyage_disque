name: Docker Hub CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/nettoyage_disque
  SHA_TAG: ${{ github.sha }}

jobs:
  publish:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[ci skip]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          echo "TAGS=${IMAGE_NAME}:latest,${IMAGE_NAME}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "TAGS=${IMAGE_NAME}:latest,${IMAGE_NAME}:${SHA_TAG},${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Update Kubernetes manifest (GitOps)
        run: |
          sed -i "s|image: .*nettoyage_disque:.*|image: ${IMAGE_NAME}:${SHA_TAG}|" k8s/cronjob.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "CI Bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/cronjob.yaml
          git diff --cached --quiet || git commit -m "chore: mise à jour image vers ${SHA_TAG} [ci skip]"
          git push
